# Ersätter jsoups egna arbetsflöden (build.yml, codeql.yml, cifuzz.yml) i forken.
# Kör alla tester vid push till main och för varje pull request.
name: Tester

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B test
